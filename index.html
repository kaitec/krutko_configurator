<!DOCTYPE html>
<html lang="ua">
<head>
  <meta charset="UTF-8">
  <title>Конфігуратор Крутько</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #d4d4d4; padding: 20px; max-width: 820px; margin: 0 auto; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
    h2 { color: #569cd6; margin: 0; }
    .controls { background: #252526; padding: 12px 15px; border-radius: 6px; border: 1px solid #3c3c3c; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    button { background: #0e639c; color: #fff; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; white-space: nowrap; }
    button:hover { background: #1177bb; }
    button:disabled { background: #3c3c3c; color: #777; cursor: not-allowed; }
    .btn-read { background: #2ea043; }
    .btn-read:hover { background: #3fb950; }
    .btn-save { background: #d29922; color: #1e1e1e; }
    .btn-save:hover { background: #e3b341; }
    .status { display: none; }
    .settings-list { background: #252526; border: 1px solid #3c3c3c; border-radius: 6px; padding: 15px; margin-bottom: 15px; display: none; }
    .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid #333; }
    .setting-item:last-child { border-bottom: none; }
    .param-name { font-family: 'Consolas', monospace; font-size: 14px; color: #dcdcaa; font-weight: bold; }
    input[type="number"], select { background: #1e1e1e; color: #4ec9b0; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 14px; }
    input[type="number"] { width: 80px; text-align: center; }
    select { min-width: 230px; cursor: pointer; }
    .freq-groups { display: none; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .freq-card { background: #252526; border: 1px solid #3c3c3c; border-radius: 6px; padding: 12px 15px; }
    .freq-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #ce9178; border-bottom: 1px solid #3c3c3c; padding-bottom: 6px; }
    .freq-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
    .freq-label { font-family: 'Consolas', monospace; font-size: 13px; color: #9cdcfe; }
    .log-box { display: none; }
  </style>
</head>
<body>
  <div class="header-bar">
    <h2>Конфігуратор Крутько</h2>
    <button id="connectBtn">ПІДКЛЮЧИТИ ПЛАТУ</button>
  </div>

  <div class="controls">
    <button id="readBtn" class="btn-read" disabled>ПРОЧИТАТИ З ПЛАТИ</button>
    <button id="saveBtn" class="btn-save" disabled>ЗАПИСАТИ В ПЛАТУ</button>
    <button id="exportFileBtn" disabled>ЗБЕРЕГТИ В ФАЙЛ</button>
    <button id="importFileBtn" disabled>ВІДКРИТИ ФАЙЛ</button>
    <input type="file" id="profileFileInput" accept=".bin" style="display:none;">
  </div>

  <div class="status" id="statusText">Статус:</div>

  <div class="settings-list" id="settingsList"></div>
  <div class="freq-groups" id="freqGroups"></div>

  <div class="log-box" id="logBox">Лог работы:</div>


  <script>
    const PROTOCOL_OPTIONS = [
      { value: 0, label: "CRSF_NORMAL" },
      { value: 1, label: "CRSF_INVERT" },
      { value: 2, label: "SBUS_NORMAL" },
      { value: 3, label: "SBUS_INVERT" }
    ];

    const BAUDRATE_OPTIONS = [
      { value: 0, label: "115200" },
      { value: 1, label: "400000" },
      { value: 2, label: "420000" }
    ];

    const TX_PORT_OPTIONS = [
      { value: 0, label: "Smart Audio" },
      { value: 1, label: "IRC TRUMP" },
      { value: 2, label: "SKYZONE_X" }
    ];

    const VRX_TYPE_OPTIONS = [
      { value: 0,  label: "VRX_SKYZONE" },
      { value: 1,  label: "VRX_SKYZONE_X" },
      { value: 2,  label: "VRX_SM1370R_12" },
      { value: 3,  label: "VRX_TA1322_12" },
      { value: 4,  label: "VRX_FLASHTECH_27" },
      { value: 5,  label: "VRX_TBS_FUSION" },
      { value: 6,  label: "VRX_RAPIDFIRE" },
      { value: 7,  label: "VTX_TRANSMITER" },
      { value: 8,  label: "VRX_THOR_R35" },
      { value: 9,  label: "VRX_THOR_R67" },
      { value: 10, label: "VRX_THOR_R78" },
      { value: 11, label: "VTX_THOR" },
      { value: 12, label: "VRX_BOX" },
      { value: 13, label: "VRX_SPAN" },
      { value: 14, label: "VRX_FLASHTECH_72" },
      { value: 15, label: "VRX_RX7500" },
      { value: 16, label: "VRX_S67B" },
      { value: 17, label: "VRX_FLASHTECH_33" }
    ];

    const PARAMS = [
      { name: "ВХІДНИЙ ПРОТОКОЛ", offset: 9,  options: PROTOCOL_OPTIONS },
      { name: "ВХІДНИЙ БІТРЕЙТ", offset: 4,  options: BAUDRATE_OPTIONS },
      { name: "ВИХІДНИЙ ПРОТОКОЛ",  offset: 8,  options: TX_PORT_OPTIONS },
      { name: "ОБЛАДНАННЯ", offset: 10, options: VRX_TYPE_OPTIONS },
      { name: "КАНАЛ ДЛЯ ЧАСТОТ",  offset: 5 },
      { name: "КАНАЛ ДЛЯ ГРУП", offset: 6 },
      { name: "КАНАЛ ДЛЯ ПОТУЖНОСТІ",  offset: 7 }
    ];

    const FREQ_GROUPS = [
      {
        title: "ГРУПА 1",
        items: [
          { name: "FREQ 1", offset: 50 },
          { name: "FREQ 2", offset: 52 },
          { name: "FREQ 3", offset: 54 },
          { name: "FREQ 4", offset: 56 },
          { name: "FREQ 5", offset: 58 },
          { name: "FREQ 6", offset: 60 }
        ]
      },
      {
        title: "ГРУПА 2",
        items: [
          { name: "FREQ 1", offset: 62 },
          { name: "FREQ 2", offset: 64 },
          { name: "FREQ 3", offset: 66 },
          { name: "FREQ 4", offset: 68 },
          { name: "FREQ 5", offset: 70 },
          { name: "FREQ 6", offset: 72 }
        ]
      },
      {
        title: "ГРУПА 3",
        items: [
          { name: "FREQ 1", offset: 74 },
          { name: "FREQ 2", offset: 76 },
          { name: "FREQ 3", offset: 78 },
          { name: "FREQ 4", offset: 80 },
          { name: "FREQ 5", offset: 82 },
          { name: "FREQ 6", offset: 84 }
        ]
      }
    ];
    const NVS_BASE_ADDR = 0x9000, NVS_TOTAL_SIZE = 0x5000;
    let ESPLoader, Transport, device = null, transport = null, esploader = null;
    let fullNvsDump = null, activeHeaderOffset = -1, activeDataOffset = -1;

    const connectBtn = document.getElementById('connectBtn');
    const readBtn = document.getElementById('readBtn');
    const saveBtn = document.getElementById('saveBtn');
    const statusText = document.getElementById('statusText');
    const settingsList = document.getElementById('settingsList');
    const freqGroups = document.getElementById('freqGroups');
    const logBox = document.getElementById('logBox');

    const terminal = {
      clean() { logBox.textContent = ""; },
      writeLine(d) { logBox.textContent += "\n" + d; logBox.scrollTop = logBox.scrollHeight; },
      write(d) { logBox.textContent += d; logBox.scrollTop = logBox.scrollHeight; }
    };

    function espRomCrc32Le(crc, bytes) {
      crc = (~crc) >>> 0;
      for (let i = 0; i < bytes.length; i++) {
        crc ^= bytes.at(i);
        for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
      }
      return (~crc) >>> 0;
    }

    function calcNvsHeaderCrc(dump, hdrOffset) {
      let crc = espRomCrc32Le(0xFFFFFFFF, dump.subarray(hdrOffset, hdrOffset + 4));
      return espRomCrc32Le(crc, dump.subarray(hdrOffset + 8, hdrOffset + 32));
    }

    function calcNvsDataCrc(dump, dataOffset, dataLen) {
      return espRomCrc32Le(0xFFFFFFFF, dump.subarray(dataOffset, dataOffset + dataLen));
    }

    function findLatestEepromSlot(dump) {
      const pageSize = 4096, totalPages = dump.length / pageSize;
      let foundRecord = null;
      for (let p = 0; p < totalPages; p++) {
        const pageOffset = p * pageSize;
        const pageState = new DataView(dump.buffer).getUint32(pageOffset, true);
        if (pageState === 0xFFFFFFFF || pageState === 0x00000000) continue;

        for (let slot = 0; slot < 126; slot++) {
          const bitmapByte = dump.at(pageOffset + 0x20 + Math.floor(slot / 4));
          if (((bitmapByte >> ((slot % 4) * 2)) & 0x03) !== 2) continue;

          const entryOffset = pageOffset + 0x40 + (slot * 32);
          const type = dump.at(entryOffset + 1), span = dump.at(entryOffset + 2);
          if (type === 0x42) {
            let keyName = "";
            for (let k = 8; k < 24; k++) {
              const ch = dump.at(entryOffset + k);
              if (ch === 0) break;
              keyName += String.fromCharCode(ch);
            }
            if (keyName === "eeprom") foundRecord = { headerOffset: entryOffset, dataOffset: entryOffset + 32 };
          }
          if (span > 1 && span < 126) slot += (span - 1);
        }
      }
      return foundRecord;
    }
    connectBtn.addEventListener('click', async () => {
      if (!("serial" in navigator)) { statusText.textContent = "Ошибка: Используйте Chrome или Edge."; return; }
      connectBtn.disabled = true;
      statusText.textContent = "Підключення до плати...";
      try {
        if (!ESPLoader || !Transport) {
          const cdnUrl = "https://unpkg.com" + "/" + "esptool-js@0.5.4" + "/" + "bundle.js";
          const mod = await import(cdnUrl);
          ESPLoader = mod.ESPLoader; Transport = mod.Transport;
        }
        device = await navigator.serial.requestPort();
        transport = new Transport(device, true);
        esploader = new ESPLoader({ transport, baudrate: 115200, terminal });
        const chip = await esploader.main();
        statusText.textContent = `Підключено (${chip}). Натисніть «Прочитати налаштування».`;
        readBtn.disabled = false;
      } catch (err) {
        statusText.textContent = "Ошибка: " + err.message;
        terminal.writeLine("ОШИБКА: " + err.message);
        connectBtn.disabled = false;
      }
    });

    readBtn.addEventListener('click', async () => {
      readBtn.disabled = true;
      try {
        statusText.textContent = "Сканирование раздела NVS (20 КБ)...";
        fullNvsDump = await esploader.readFlash(NVS_BASE_ADDR, NVS_TOTAL_SIZE);
        const found = findLatestEepromSlot(fullNvsDump);
        if (!found) throw new Error("Активная запись 'eeprom' не найдена.");

        activeHeaderOffset = found.headerOffset;
        activeDataOffset = found.dataOffset;
        const physZeroAddr = (NVS_BASE_ADDR + activeDataOffset).toString(16).toUpperCase();
        terminal.writeLine(`Найдена запись EEPROM! Нулевой байт: 0x${physZeroAddr}`);

        renderFields(fullNvsDump);
        renderFreqGroups(fullNvsDump);
        statusText.textContent = `Актуальный EEPROM найден по адресу 0x${physZeroAddr}.`;
        saveBtn.disabled = false;
        exportFileBtn.disabled = false;
        importFileBtn.disabled = false;

      } catch (err) {
        statusText.textContent = "Ошибка: " + err.message;
        terminal.writeLine("ОШИБКА: " + err.message);
      } finally { readBtn.disabled = false; }
    });

    function renderFields(dumpBytes) {
      settingsList.innerHTML = "";
      PARAMS.forEach(param => {
        const val = dumpBytes.at(activeDataOffset + param.offset);
        const item = document.createElement("div");
        item.className = "setting-item";

        const title = document.createElement("div");
        title.className = "param-name";
        title.textContent = param.name;

        let controlEl;
        if (param.options) {
          controlEl = document.createElement("select");
          param.options.forEach(opt => {
            const o = document.createElement("option");
            o.value = opt.value; o.textContent = opt.label;
            controlEl.appendChild(o);
          });
          if (!param.options.some(o => o.value === val)) {
            const u = document.createElement("option");
            u.value = val; u.textContent = `Неизвестно (${val})`;
            controlEl.appendChild(u);
          }
          controlEl.value = val;
        } else {
          controlEl = document.createElement("input");
          controlEl.type = "number"; controlEl.min = 0; controlEl.max = 255;
          controlEl.value = val;
        }

        controlEl.classList.add("param-value");
        controlEl.dataset.offset = param.offset;
        item.append(title, controlEl);
        settingsList.appendChild(item);
      });
      settingsList.style.display = "block";
    }

    function renderFreqGroups(dumpBytes) {
      freqGroups.innerHTML = "";
      const dv = new DataView(dumpBytes.buffer);

      FREQ_GROUPS.forEach(group => {
        const card = document.createElement("div");
        card.className = "freq-card";

        const header = document.createElement("h3");
        header.textContent = group.title;
        card.appendChild(header);

        group.items.forEach(item => {
          const val16 = dv.getUint16(activeDataOffset + item.offset, true);
          const row = document.createElement("div");
          row.className = "freq-row";

          const label = document.createElement("span");
          label.className = "freq-label";
          label.textContent = `${item.name}:`;

          const input = document.createElement("input");
          input.type = "number";
          input.min = 0;
          input.max = 65535;
          input.value = val16;
          input.classList.add("freq-value");
          input.dataset.offset = item.offset;

          row.append(label, input);
          card.appendChild(row);
        });
        freqGroups.appendChild(card);
      });
      freqGroups.style.display = "grid";
    }

    saveBtn.addEventListener('click', async () => {
      if (!fullNvsDump || activeDataOffset < 0) return;
      saveBtn.disabled = true; readBtn.disabled = true;

      try {
        statusText.textContent = "Запись настроек в ESP32-C3...";
        const updatedDump = new Uint8Array(fullNvsDump);
        const dv = new DataView(updatedDump.buffer);
        const dataLen = dv.getUint16(activeHeaderOffset + 0x18, true);

        settingsList.querySelectorAll('.param-value').forEach(el => {
          const offset = parseInt(el.dataset.offset);
          const val = Math.max(0, Math.min(255, parseInt(el.value) || 0));
          updatedDump.set(Uint8Array.of(val), activeDataOffset + offset);
        });

        freqGroups.querySelectorAll('.freq-value').forEach(el => {
          const offset = parseInt(el.dataset.offset);
          const val16 = Math.max(0, Math.min(65535, parseInt(el.value) || 0));
          dv.setUint16(activeDataOffset + offset, val16, true);
        });

        dv.setUint32(activeHeaderOffset + 0x1C, calcNvsDataCrc(updatedDump, activeDataOffset, dataLen), true);
        dv.setUint32(activeHeaderOffset + 0x04, calcNvsHeaderCrc(updatedDump, activeHeaderOffset), true);

        const startPage = Math.floor(activeHeaderOffset / 4096);
        const endPage = Math.floor((activeDataOffset + dataLen + 32) / 4096);
        const writeOffset = startPage * 4096;
        const writeSize = (endPage - startPage + 1) * 4096;

        const sliceToWrite = updatedDump.subarray(writeOffset, writeOffset + writeSize);
        const binStr = esploader.ui8ToBstr(sliceToWrite);

        await esploader.writeFlash({
          fileArray: [{ data: binStr, address: NVS_BASE_ADDR + writeOffset }],
          flashSize: "keep", flashMode: "keep", flashFreq: "keep",
          eraseAll: false, compress: true
        });

        fullNvsDump = updatedDump;
        statusText.textContent = "Записано! Нажмите кнопку RST на плате для проверки.";
        terminal.writeLine(`ГОТОВО! Записано ${writeSize} байт по адресу 0x${(NVS_BASE_ADDR + writeOffset).toString(16).toUpperCase()}.`);
      } catch (err) {
        statusText.textContent = "Ошибка записи: " + err.message;
        terminal.writeLine("ОШИБКА записи: " + err.message);
      } finally { saveBtn.disabled = false; readBtn.disabled = false; }
    });

        const exportFileBtn = document.getElementById('exportFileBtn');
    const importFileBtn = document.getElementById('importFileBtn');
    const profileFileInput = document.getElementById('profileFileInput');

    // Собирает актуальный срез EEPROM[0..dataLen] с учетом текущих значений на экране
    function buildUpdatedDumpFromUI() {
      const updatedDump = new Uint8Array(fullNvsDump);
      const dv = new DataView(updatedDump.buffer);

      settingsList.querySelectorAll('.param-value').forEach(el => {
        const offset = parseInt(el.dataset.offset);
        const val = Math.max(0, Math.min(255, parseInt(el.value) || 0));
        updatedDump.set(Uint8Array.of(val), activeDataOffset + offset);
      });

      freqGroups.querySelectorAll('.freq-value').forEach(el => {
        const offset = parseInt(el.dataset.offset);
        const val16 = Math.max(0, Math.min(65535, parseInt(el.value) || 0));
        dv.setUint16(activeDataOffset + offset, val16, true);
      });

      return updatedDump;
    }

    // Сохранение байтов со 2 по 90 включительно (89 байт) в файл
    exportFileBtn.addEventListener('click', () => {
      if (!fullNvsDump || activeDataOffset < 0) return;

      const currentDump = buildUpdatedDumpFromUI();
      // Срез со 2-го по 90-й байт включительно (индексы 2..90 -> длина 89 байт)
      const slice2to90 = currentDump.slice(activeDataOffset + 2, activeDataOffset + 91);

      const blob = new Blob([slice2to90], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Krutko config.bin";
      a.click();
      URL.revokeObjectURL(url);

      terminal.writeLine("Профиль EEPROM[2..90] (89 байт) сохранен в файл eeprom_profile_2_90.bin.");
      statusText.textContent = "Файл настроек eeprom_profile_2_90.bin сохранен.";
    });

    // Открытие диалога выбора файла
    importFileBtn.addEventListener('click', () => {
      if (!fullNvsDump || activeDataOffset < 0) return;
      profileFileInput.value = "";
      profileFileInput.click();
    });

    // Загрузка файла и применение байтов 2..90 поверх текущего дампа платы
    profileFileInput.addEventListener('change', async () => {
      const file = profileFileInput.files.item(0);
      if (!file || !fullNvsDump || activeDataOffset < 0) return;

      try {
        const buf = await file.arrayBuffer();
        const fileBytes = new Uint8Array(buf);

        if (fileBytes.length !== 89) {
          throw new Error(`Неверный размер файла (${fileBytes.length} байт). Ожидается ровно 89 байт (индексы 2–90).`);
        }

        // Накладываем загруженные 89 байт на смещение +2 (байты 0 и 1 остаются родными от этой платы!)
        fullNvsDump.set(fileBytes, activeDataOffset + 2);

        // Перерисовываем все поля и частоты на экране из обновленного дампа
        renderFields(fullNvsDump);
        renderFreqGroups(fullNvsDump);

        terminal.writeLine(`Загружен профиль из файла "${file.name}" (байты 2–90 обновлены, MAC CRC в 0–1 сохранен).`);
        statusText.textContent = "Профиль загружен! Нажмите «3. Записать в ESP32-C3» для прошивки.";
      } catch (err) {
        statusText.textContent = "Ошибка загрузки файла: " + err.message;
        terminal.writeLine("ОШИБКА файла: " + err.message);
      }
    });

  </script>
</body>
</html>
